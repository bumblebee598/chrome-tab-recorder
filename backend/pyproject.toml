[project]
name = "tab-recorder-backend"
version = "0.1.0"
description = "FastAPI backend for the Chrome tab recorder pipeline (Cloud Run + Cloud Tasks + Firestore)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "google-cloud-firestore>=2.16",
    "google-cloud-tasks>=2.16",
    "pyjwt>=2.8",
    "cryptography>=42",
    "google-cloud-storage>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "jsonschema>=4.22",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
