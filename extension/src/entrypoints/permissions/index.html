<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Recorder — Microphone access</title>
    <style>
      body {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f7f2e8;
        color: #2e2820;
        max-width: 480px;
        margin: 80px auto;
        padding: 0 20px;
        text-align: center;
      }
      button {
        border: none;
        border-radius: 6px;
        padding: 10px 18px;
        font-size: 15px;
        background: #1a73e8;
        color: #fff;
        cursor: pointer;
      }
      #status {
        margin-top: 16px;
        font-size: 14px;
      }
      .ok { color: #188038; }
      .err { color: #d93025; }
    </style>
  </head>
  <body>
    <h1>Microphone access</h1>
    <p>
      Tab Recorder records your narration alongside the tab. Chrome asks for microphone
      permission once per extension — grant it here, then start recording from the popup.
    </p>
    <button id="grant">Enable microphone</button>
    <p id="status"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
